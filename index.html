<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chatbot Profissional</title>
    <!-- 1. Importando Marked.js para entender Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { background: white; width: 450px; padding: 20px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .historico { height: 350px; overflow-y: auto; background: #f8f9fa; padding: 15px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 15px; }
        .mensagem { margin-bottom: 15px; padding: 10px; border-radius: 10px; line-height: 1.4; }
        .user { background: #007bff; color: white; margin-left: 20%; text-align: right; }
        .bot { background: #e9ecef; color: #333; margin-right: 20%; text-align: left; }
        .controles { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        button { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-enviar { background: #28a745; color: white; }
        .btn-limpar { background: #dc3545; color: white; width: 100%; margin-top: 10px; }
        /* Estilização para códigos dentro do chat */
        pre { background: #272822; color: white; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>🤖 Assistente IA</h2>
        <div class="historico" id="historico"></div>
        <div class="controles">
            <input type="text" id="pergunta" placeholder="Digite sua pergunta...">
            <button class="btn-enviar" onclick="enviarMensagem()">Enviar</button>
        </div>
        <button class="btn-limpar" onclick="limparConversa()">🗑️ Limpar Conversa</button>
    </div>

    <script>
        const URL_BASE = window.location.origin + "/api/chat";

        async function enviarMensagem() {
            const input = document.getElementById("pergunta");
            const historico = document.getElementById("historico");
            const texto = input.value;
            if(!texto) return;

            // Mostra pergunta do usuário
            historico.innerHTML += `<div class="mensagem user">${texto}</div>`;
            input.value = "";
            
            const botMsgDiv = document.createElement("div");
            botMsgDiv.className = "mensagem bot";
            botMsgDiv.innerHTML = "<i>Pensando...</i>";
            historico.appendChild(botMsgDiv);

            try {
                const response = await fetch(URL_BASE, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pergunta: texto })
                });
                const dados = await response.json();

                if (dados.sucesso) {
                    // 2. USO DO MARKED: Transforma o Markdown da IA em HTML bonito
                    botMsgDiv.innerHTML = marked.parse(dados.resposta);
                } else {
                    botMsgDiv.innerHTML = "Erro: " + dados.erro;
                }
            } catch (erro) {
                botMsgDiv.innerHTML = "Erro de conexão ❌";
            }
            historico.scrollTop = historico.scrollHeight;
        }

        // 3. FUNCIONALIDADE DE LIMPAR
        async function limparConversa() {
            if(!confirm("Deseja apagar todo o histórico?")) return;

            try {
                const response = await fetch(`${URL_BASE}/limpar`, { method: "DELETE" });
                const dados = await response.json();
                if(dados.sucesso) {
                    document.getElementById("historico").innerHTML = "";
                    alert("Conversa resetada!");
                }
            } catch (erro) {
                alert("Erro ao limpar conversa.");
            }
        }

        // Permitir enviar com a tecla Enter
        document.getElementById("pergunta").addEventListener("keypress", (e) => {
            if(e.key === 'Enter') enviarMensagem();
        });
    </script>
</body>
</html>
